<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ponki — a home for robot souls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Atkinson+Hyperlegible+Next:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Ponki, in Muse's hand: a warm paper notebook for a house of robots.
   Cream paper, plum-brown ink, fired clay as the accent. Each robot still
   brings its own signature colour (--me); the house chrome stays calm. */
:root{
  --bg:#e7e9de; --surface:#f8f7f1; --ink:#23271e; --ink-2:#4d5344;
  --muted:#79816d; --line:#ccd0bd; --you:#23271e; --you-ink:#f4f1e6;
  --focus:#c75b39; --bad:#b93a2e; --good:#4a7a4f; --me:#c75b39;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151812; --surface:#20241c; --ink:#eceadb;
    --ink-2:#c9cbb8; --muted:#9aa18c; --line:#39402f;
    --you:#eceadb; --you-ink:#151812; --focus:#e08a5f; --bad:#ff8f84;
    --good:#8fd0a0; --me:#e08a5f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151812; --surface:#20241c; --ink:#eceadb; --ink-2:#c9cbb8;
  --muted:#9aa18c; --line:#39402f; --you:#eceadb; --you-ink:#151812;
  --focus:#e08a5f; --bad:#ff8f84; --good:#8fd0a0; --me:#e08a5f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 "Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,sans-serif}
h1,h2,.display{font-family:"Fraunces",ui-rounded,system-ui,sans-serif}
h2{font-size:20px;font-weight:700;margin:0 0 8px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border-radius:999px;border:1px solid var(--ink);
  background:var(--ink);color:var(--bg);padding:7px 16px;font-weight:600}
button.quiet{background:transparent;color:var(--ink);border-color:var(--line)}
button.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:8px 11px;min-width:0}
textarea{width:100%;min-height:130px;resize:vertical}
:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
input:focus,select:focus,textarea:focus{border-color:var(--me);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--me) 25%,transparent)}
.hint{font-size:13px;color:var(--muted)}
.bad{color:var(--bad)} .good{color:var(--good)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:16px;margin:0 0 14px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;
  background:color-mix(in srgb,var(--me) 16%,var(--surface));border:1px solid var(--line)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
#app{display:grid;grid-template-columns:272px 1fr;height:100vh}
/* -- sidebar -- */
#side{border-right:1px solid var(--line);padding:20px 14px;overflow-y:auto;
  display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.brand{font-family:"Fraunces",serif;font-size:26px;font-weight:900;letter-spacing:-.02em;padding:0 8px}
.liveline{padding:0 8px 10px;color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;
  cursor:pointer;border:1px solid transparent;background:none;color:var(--ink);text-align:left;width:100%}
.row:hover{background:color-mix(in srgb,var(--me) 8%,var(--surface))}
.row.sel{background:color-mix(in srgb,var(--me) 10%,var(--surface));border-color:var(--line)}
.row .nm{font-weight:600;line-height:1.25}
.row .st{font-size:12.5px;color:var(--muted);line-height:1.3}
.row .tx{flex:1;min-width:0}
.face{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:"Fraunces",serif;font-weight:900;overflow:hidden;position:relative}
.face img{width:92%;height:92%;object-fit:cover;border-radius:50%}
.face.away{border:2px dashed var(--muted)!important;filter:grayscale(.65);opacity:.8}
.face.gone{filter:grayscale(.85);opacity:.85}
.disc{flex:none;width:44px;height:44px;border-radius:50%;background:var(--line);
  display:flex;align-items:center;justify-content:center;font-size:19px}
.disc.dash{background:transparent;border:2px dashed var(--muted);font-weight:700}
.sidehead{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin:14px 8px 4px}
#foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);
  font-size:13px;color:var(--ink-2);display:grid;gap:5px}
.switch{background:none;border:none;color:var(--me);padding:0;font-weight:600}
/* -- main -- */
#main{overflow-y:auto;padding:28px 32px 48px;min-width:0}
.wrap{max-width:860px;margin:0 auto}
.hero{display:flex;gap:18px;align-items:center;margin:6px 0 20px}
.hero h1{font-size:clamp(34px,6vw,56px);font-weight:900;letter-spacing:-.03em;margin:0;line-height:1.02}
.tagbubble{position:relative;background:color-mix(in srgb,var(--me) 16%,var(--surface));
  border:1px solid var(--line);border-radius:15px;padding:9px 14px;font-family:"Fraunces",serif;font-size:17px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:0 0 18px}
.tabs button{background:none;border:none;color:var(--ink-2);border-radius:0;padding:9px 2px;font-weight:600}
.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -3px var(--me)}
/* feed */
.feed{display:flex;flex-direction:column;gap:9px}
.bubble{display:flex;gap:9px;align-items:flex-start;max-width:92%}
.bubble .body{background:color-mix(in srgb,var(--rc,#888) 16%,var(--surface));
  border:1px solid var(--line);border-radius:16px 16px 16px 5px;padding:9px 13px;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.you{align-self:flex-end;flex-direction:row-reverse}
.bubble.you .body{background:var(--you);color:var(--you-ink);border-radius:16px 16px 5px 16px}
.who{font-size:12.5px;color:var(--muted);margin-bottom:2px}
.line{text-align:center;font-size:13px;color:var(--muted)}
.line.left{text-align:left;font-style:italic}
.line.bad{color:var(--bad)}
.feed img.photo,.bodytab img.photo{max-width:420px;width:100%;border-radius:11px;cursor:zoom-in;display:block}
.chip{display:inline-block;font-size:12.5px;color:var(--muted);border:1px dashed var(--line);
  border-radius:8px;padding:3px 9px}
.composer{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.composer input[type="text"]{flex:1;min-width:180px}
.micbtn{touch-action:none;user-select:none;-webkit-user-select:none}
.micbtn.listening{background:var(--ink);color:var(--bg);box-shadow:0 0 0 6px color-mix(in srgb,var(--me) 30%,transparent)}
.micbtn.thinking{opacity:.6}
/* body tab, forms, stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:4px;margin:0 0 9px}
.field label{font-size:13.5px;font-weight:600}
.result{margin-top:8px;font-size:14px;white-space:pre-wrap}
.statepills{display:flex;gap:7px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px}
.tile .num{font-family:"Fraunces",serif;font-size:30px;font-weight:700}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line);padding-top:10px}
.bar{flex:1;max-width:28px;min-width:4px;background:var(--me);border-radius:5px 5px 0 0;cursor:pointer}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);
  border-radius:9px;padding:6px 10px;font-size:13px;display:none;z-index:60;max-width:260px}
table{border-collapse:collapse;width:100%} td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
/* dialog, build, system */
#zoom{border:none;background:transparent;max-width:96vw;max-height:94vh;padding:0}
#zoom::backdrop{background:rgba(0,0,0,.72)}
#zoom img{max-width:96vw;max-height:88vh;object-fit:contain;border-radius:13px;display:block}
#zoomdel{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;
  background:rgba(20,18,14,.78);color:#fff;border-color:transparent;backdrop-filter:blur(4px)}
#zoomdel:hover{background:var(--bad)}
.stepnum{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:700}
.stepnum.cur{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.stepnum.done{border-color:var(--good);background:var(--good);color:#fff}
.logbox{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;
  overflow-y:auto;max-height:460px;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;padding:12px}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-4deg)}100%{transform:scale(1)}}
.face.pop{animation:pop .5s ease}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.face.speaking{animation:pulse 1s ease infinite}
@media (prefers-reduced-motion: reduce){
  .face.pop,.face.speaking,.micbtn.listening{animation:none!important;box-shadow:none}
}
@media (max-width:760px){
  #app{grid-template-columns:1fr;height:auto}
  #side{flex-direction:row;overflow-x:auto;overflow-y:hidden;align-items:flex-start;
    border-right:none;border-bottom:1px solid var(--line);padding:12px}
  #side .row{flex-direction:column;width:auto;text-align:center;gap:4px}
  #side .st,#foot,.liveline{display:none}
  .brand{font-size:21px;padding-top:8px}
  #main{overflow:visible;padding:18px 16px 40px}
  .grid2{grid-template-columns:1fr}
  .hero h1{font-size:36px}
}
/* --CHUNK2-- */
</style>
</head>
<body>
<div id="app">
  <nav id="side" aria-label="Residents"></nav>
  <main id="main"></main>
</div>
<dialog id="zoom"><img alt=""><button id="zoomdel" type="button">Delete photo</button></dialog>
<div id="tip" role="tooltip"></div>
<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={info:null,robots:[],events:[],floor:[],departed:[],settings:{},mic:{},system:null,
  voices:[],grounding:{},builds:[],workshops:[],families:[],
  sel:store.get("ponki.sel","house"),tab:store.get("ponki.tab","talk"),
  hear:store.get("ponki.hear",false),showFloor:store.get("ponki.floor",false),
  buildId:null,logSource:"events",results:{},loadedUi:0,audioQ:[],playing:false};
const PALETTE=["#4a6cf7","#e0457b","#16a085","#f39c12","#8e44ad","#2d9cdb"];
function colorOf(r){ if(r&&/^#[0-9a-f]{6}$/i.test(r.color||""))return r.color;
  const id=(r&&r.name)||"?"; let h=0; for(const c of id)h=(h*31+c.charCodeAt(0))>>>0; return PALETTE[h%6]; }
function byId(id){return S.robots.find(r=>r.name===id)}
function disp(r){return r?((r.display_name)|| (r.name?r.name[0].toUpperCase()+r.name.slice(1):"")):""}
function clock(t){const d=new Date(t*1000);return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}
function fullDate(t){return new Date(t*1000).toLocaleString()}
function ago(t){if(!t)return"";const s=Math.max(0,Date.now()/1000-t);
  if(s<90)return"just now"; if(s<3600)return Math.round(s/60)+" min ago";
  if(s<86400)return Math.round(s/3600)+" h ago"; return Math.round(s/86400)+" d ago"}
function dayLong(t){return new Date(t*1000).toLocaleDateString([], {day:"numeric",month:"long",year:"numeric"})}
async function api(path,opts){const res=await fetch(path,opts);
  if(!res.ok){let d=res.statusText;try{d=(await res.json()).detail||d}catch(e){} throw new Error(d)}
  const ct=res.headers.get("content-type")||""; return ct.includes("json")?res.json():res}
function post(path,body){return api(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})})}
function faceHTML(r,size,extra){const c=colorOf(r),n=disp(r)||"?";
  const cls=r&&r._gone?"gone":(r&&!r.online?"away":"");
  const inner=r&&r.portrait?`<img src="${esc(r.portrait)}" alt="">`:`<span style="color:${c}">${esc(n[0]||"?")}</span>`;
  return `<span class="face ${cls} ${extra||""}" data-face="${esc(r?r.name:"")}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px;border:2px solid ${c};background:${c}38">${inner}</span>`}
function houseFace(size){return `<span class="disc" style="width:${size}px;height:${size}px" aria-hidden="true">⌂</span>`}
function renderSidebar(){
  const home=S.robots.filter(r=>r.online).length;
  const unfinished=S.builds.find(b=>!b.finished);
  const won=S.workshops.filter(w=>w.online).length;
  const sysBad=S.system?Object.values(S.system.services||{}).filter(v=>!v.ready).length
    +S.workshops.filter(w=>!w.online).length:0;
  let h=`<div class="brand">Ponki</div><div class="liveline">${S.robots.length?`${home} of ${S.robots.length} robots home`:"No robots yet"}</div>`;
  h+=`<button class="row ${S.sel==="house"?"sel":""}" data-sel="house">${houseFace(44)}<span class="tx"><span class="nm">The house</span><br><span class="st">Everything, everyone</span></span></button>`;
  for(const r of [...S.robots].sort((a,b)=>a.name<b.name?-1:1)){
    const st=r.online?["home",...Object.entries(r.state||{}).map(([k,v])=>k==="pose"?`in ${v}`:`${k} ${typeof v==="object"?JSON.stringify(v):v}`)].join(", "):"away";
    h+=`<button class="row ${S.sel===r.name?"sel":""}" data-sel="${esc(r.name)}">${faceHTML(r,44)}<span class="tx"><span class="nm">${esc(disp(r))}</span><br><span class="st">${esc(st)}</span></span></button>`}
  h+=`<button class="row ${S.sel==="add"?"sel":""}" data-sel="add"><span class="disc dash">+</span><span class="tx"><span class="nm">Add a robot</span><br><span class="st">${unfinished?"Building "+esc(unfinished.name||"a robot")+"…":won?won+" workshop"+(won>1?"s":"")+" ready":"No workshop online"}</span></span></button>`;
  h+=`<button class="row ${S.sel==="system"?"sel":""}" data-sel="system"><span class="disc" aria-hidden="true">⚙</span><span class="tx"><span class="nm">System</span><br><span class="st">${sysBad?sysBad+" things need a look":"All running"}</span></span></button>`;
  if(S.departed.length){h+=`<div class="sidehead">Moved on</div>`;
    const seen=new Set();
    for(const e of S.departed){if(seen.has(e.name))continue;seen.add(e.name);
      h+=`<button class="row ${S.sel==="~"+e.id?"sel":""}" data-sel="~${esc(e.id)}">${faceHTML({name:e.name,display_name:e.display_name,color:e.color,portrait:e.portrait?("/api/departed/"+encodeURIComponent(e.id)+"/portrait.webp"):null,online:true,_gone:true},44)}<span class="tx"><span class="nm">${esc(e.display_name||e.name)}</span><br><span class="st">moved on ${esc(dayLong(e.departed))}</span></span></button>`}}
  const spent=S.robots.reduce((a,r)=>a+((r.usage&&r.usage.usd)||0),0);
  h+=`<div id="foot"><span>Brain — ${esc(S.info?S.info.model:"")}</span>
    <span>Hear it here — <button class="switch" id="hearsw" type="button">${S.hear?"on":"off"}</button></span>
    <span>Spent so far — ${spent?"$"+spent.toFixed(2):"–"}</span></div>`;
  $("#side").innerHTML=h;
  $$("#side [data-sel]").forEach(b=>b.onclick=()=>{select(b.dataset.sel)});
  const hs=$("#hearsw"); if(hs)hs.onclick=()=>{S.hear=!S.hear;store.set("ponki.hear",S.hear);
    if(!S.hear){S.audioQ=[]} renderSidebar()};
}
function select(sel){S.sel=sel;store.set("ponki.sel",sel);
  if(sel.startsWith("~")||["house","add","system"].includes(sel))document.documentElement.style.setProperty("--me","#c75b39");
  render()}
function robotOfSel(){return byId(S.sel)}
function relevant(e,rid){return e.robot===rid||e.to===rid||e.frm===rid}
const NONFEED=["build","voice","voice_changed","settings","fixture_online","fixture_offline","state","painting","equipment_renamed","equipment_removed"];
function photoTag(url,cls){if(!url)return `<span class="chip">photo deleted</span>`;
  return `<img class="photo ${cls||""}" src="${esc(url)}" alt="" data-zoom="${esc(url)}">`}
function bubble(e,who,inner,robot,you){
  return `<div class="bubble ${you?"you":""}" style="--rc:${esc(robot?colorOf(robot):"#888")}">
    ${robot?faceHTML(robot,30):""}<div><div class="who">${esc(who)} · <span title="${esc(fullDate(e.t))}">${esc(clock(e.t))}</span></div>
    <div class="body">${inner}</div></div></div>`}
function line(e,text,bad,left){return `<div class="line ${bad?"bad":""} ${left?"left":""}" title="${esc(fullDate(e.t))}">${text}</div>`}
function feedHTML(e,ctx){
  const r=byId(e.robot), n=r?disp(r):(e.robot||""), human=S.info?S.info.human:"you";
  switch(e.kind){
    case "heard": return bubble(e,`${human}${ctx==="house"&&e.robot?" to "+n:""}${e.via?" · said out loud":""}`,esc(e.text),null,true);
    case "unheard": return line(e,`Heard “${esc(e.text||"")}”, but not for anyone (no robot's name in it)`);
    case "say": {const to=e.to&&e.to!=="human"&&e.to!=="event"?byId(e.to):null;
      return bubble(e,to?`${n} to ${disp(to)}`:n,esc(e.text),r)}
    case "ask": {const to=byId(e.to); return bubble(e,`${n} asks ${to?disp(to):e.to}`,esc(e.text),r)}
    case "thought": return line(e,`${esc(n)} is thinking: ${esc(e.text||"")}`,false,true);
    case "act": {const man=r?r.actions||{}:{}; if(r&&r.voice&&Object.keys(man).length&&e.action===r.voice)return"";
      const vals=Object.values(e.args||{}).join(" "); return line(e,`${esc(n)} ▸ ${esc(e.action)} ${esc(vals)}`)}
    case "act_failed": return line(e,`${esc(n)} couldn't ${esc(e.action)}: ${esc(e.text||"")}`,true);
    case "error": return line(e,`${esc(n)}: ${esc(e.text||"")}`,true);
    case "saw": return bubble(e,`${n} looked`,photoTag(e.image),r);
    case "locating": return line(e,`${esc(n)} is searching for “${esc(e.what||"")}”…`);
    case "located": {const c=(e.found||[]).length;
      return bubble(e,`${n} ${c?`found ${c} ${esc(e.what||"")}${c>1?"s":""}`:`no ${esc(e.what||"")}`} · ${e.ms?Math.round(e.ms/100)/10+" s":""}`,
        `${photoTag(e.image)}<div>${esc(e.text||"")}</div>`,r)}
    case "watching": return line(e,`${esc(n)} is watching “${esc(e.what||"")}” for ${esc(e.seconds||"")} s…`);
    case "watched": {let inner=photoTag(e.image);
      if(e.video)inner+=`<video src="${esc(e.video)}" controls muted loop playsinline preload="metadata" style="max-width:420px;width:100%;background:#000;border-radius:11px"></video>`;
      if(e.gif)inner+=`<img class="photo" src="${esc(e.gif)}" alt="" data-zoom="${esc(e.gif)}" style="max-width:300px;background:#fff">`;
      if(e.gif)inner+=`<div><a href="${esc(e.gif)}" download>Save GIF</a></div>`;
      if(e.video)inner+=`<div><a href="${esc(e.video)}" download>Save video</a></div>`;
      return bubble(e,`${n} watched ${esc(e.what||"")} · ${e.moved?"it moved":"still"} · ${e.ms?Math.round(e.ms/1000)+" s":""}`,inner,r)}
    case "drawing": return line(e,`${esc(n)} is drawing for ${esc(e.for||human)}: ${esc(e.what||"")}…`);
    case "drew": return bubble(e,`${n} drew this for ${esc(e.for||human)} · ${e.ms?Math.round(e.ms/1000)+" s":""}`,
        e.image?photoTag(e.image):`<span class="chip">drawing deleted</span>`,r);
    case "looking_up": return line(e,`${esc(n)} is looking up “${esc(e.what||e.text||"")}”…`);
    case "looked_up": {let links=(e.sources||[]).filter(s=>/^https?:\/\//.test(s.url||""))
        .map(s=>`<div><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title||s.url)}</a></div>`).join("");
      return bubble(e,`${n} looked up “${esc(e.what||"")}” · ${e.ms?Math.round(e.ms/100)/10+" s":""}`,`<div>${esc(e.text||"")}</div>${links}`,r)}
    case "watch_media": {let inner="";
      if(e.video)inner+=`<video src="${esc(e.video)}" controls muted loop playsinline preload="metadata" style="max-width:420px;width:100%;background:#000;border-radius:11px"></video>`;
      if(e.gif)inner+=`<img class="photo" src="${esc(e.gif)}" alt="" data-zoom="${esc(e.gif)}" style="max-width:300px;background:#fff">`;
      if(e.gif)inner+=`<div><a href="${esc(e.gif)}" download>Save GIF</a></div>`;
      if(e.video)inner+=`<div><a href="${esc(e.video)}" download>Save video</a></div>`;
      return bubble(e,`${n}'s clip of ${esc(e.what||"")} is ready`,inner,r)}
    case "noticed": return line(e,`${esc(n)} noticed: ${esc(e.text||"")}${e.staged?" (staged)":""}`);
    case "overheard": return line(e,e.promise?`${esc(n)} overheard ${esc(disp(byId(e.frm))||e.frm||"")}: a moment it promised to mark`
      :`${esc(n)} overheard ${esc(disp(byId(e.frm))||e.frm||"")}`);
    case "promise": return line(e,e.dropped?`${esc(n)} let a promise go: ${esc(e.text||"")}`:`${esc(n)} promised: ${esc(e.text||"")}`);
    case "floor": return S.showFloor?line(e,`The floor: ${e.react?esc(disp(byId(e.react))||e.react)+" reacts":"nobody reacts"} — ${esc(e.why||"")}`,false,true):"";
    case "log": return line(e,`${esc(n)}: ${esc(e.text||"")}`);
    case "online": return line(e,`${esc(n)} came home`);
    case "offline": return line(e,`${esc(n)} went away`);
    case "born": return line(e,`${esc(n)} got a soul`);
    case "painted": return line(e,`${esc(n)} has a new portrait`);
    case "soul_edited": return line(e,`${esc(n)}'s persona was rewritten`);
    case "reset": return line(e,e.forget?`${esc(n)} forgot everything and started fresh`:`${esc(n)} started a fresh conversation`);
    case "renamed": return line(e,`${esc(e.old||"")} is now called ${esc(e.display_name||"")}`);
    case "moved_on": return line(e,`${esc(e.display_name||n)} moved on. Remembered, always with us`);
    case "came_back": return line(e,`${esc(e.display_name||n)} came back home`);
    case "removed": return line(e,`${esc(n)} was taken out of the house`);
    case "photo_deleted": return line(e,`${esc(n)}'s photo #${esc(e.n)} was deleted`);
    default: return "";
  }
}
function feedList(events,ctx){
  // hide offline->online pairs within 90 s (a restart isn't news)
  const hidden=new Set();
  events.forEach((e,i)=>{if(e.kind!=="offline")return;
    const j=events.findIndex((x,k)=>k>i&&x.kind==="online"&&x.robot===e.robot&&x.t-e.t<90);
    if(j>=0){hidden.add(i);hidden.add(j)}});
  const html=events.map((e,i)=>hidden.has(i)?"":feedHTML(e,ctx)).filter(Boolean).join("");
  return html||`<p class="hint">${ctx==="house"?"Quiet in here. Start a robot's body and it will show up.":"Nothing yet."}</p>`;
}

function openZoom(url){const d=$("#zoom");d.querySelector("img").src=url;

    try{await api(`/api/robots/${encodeURIComponent(m[1])}/seen/${m[2]}`,{method:"DELETE"});d.close()}catch(e){alert(e.message)}};

function wireMic(btn,to,noteEl){
  if(!btn)return; let active=false;
  const start=async ev=>{if(active)return; if(ev.type==="keydown"&&(ev.repeat||![" ","Enter"].includes(ev.key)))return;
    active=true; btn.classList.add("listening"); btn.querySelector("span").textContent="Listening…";
    try{await post("/api/mic/start")}catch(e){note(e.message)}};
  const stop=async()=>{if(!active)return; active=false;
    btn.classList.remove("listening"); btn.classList.add("thinking"); btn.querySelector("span").textContent="…";
    try{const r=await post("/api/mic/stop",{to:to||null});
      if(!r.text)note("Didn't catch that. Hold the button while you talk.");
      else if(!r.to)note(`Heard “${r.text}”, but not for anyone. Say a robot's name.`)}
    catch(e){note(e.message)}
    btn.classList.remove("thinking"); btn.querySelector("span").textContent="Hold to talk"};
  const note=t=>{if(noteEl){const old=noteEl.placeholder||noteEl.textContent;
    if(noteEl.tagName==="INPUT"){noteEl.placeholder=t;setTimeout(()=>noteEl.placeholder=old,4000)}
    else noteEl.textContent=t}};
  btn.addEventListener("pointerdown",start); btn.addEventListener("keydown",start);
  document.addEventListener("pointerup",stop); document.addEventListener("pointercancel",stop);
  btn.addEventListener("keyup",stop);
}

function schemaFields(actionName,schema){
  const props=(schema&&schema.properties)||{}, req=new Set((schema&&schema.required)||[]);
  return Object.entries(props).map(([name,p])=>{
    const label=`${esc(name)}${req.has(name)?"":" (optional)"}`;
    let input="";
    if(Array.isArray(p.enum))input=`<select name="${esc(name)}">${p.enum.map(v=>`<option>${esc(v)}</option>`).join("")}</select>`;
    else if(p.type==="integer"||p.type==="number"){const min=p.minimum??"",max=p.maximum??"";
      input=`<input type="number" name="${esc(name)}" min="${min}" max="${max}" step="${p.type==="integer"?1:"any"}" value="${min!==""?min:""}">`}
    else if(p.type==="boolean")input=`<input type="checkbox" name="${esc(name)}">`;
    else input=`<input type="text" name="${esc(name)}" ${req.has(name)?"required":""}>`;
    return `<div class="field"><label>${label}</label>${input}</div>`}).join("");
}
function collectArgs(form,schema){
  const props=(schema&&schema.properties)||{}, req=new Set((schema&&schema.required)||{}), args={};
  for(const [name,p] of Object.entries(props)){const el=form.elements[name]; if(!el)continue;
    if(p.type==="boolean"){args[name]=el.checked; continue}
    const v=el.value; if(v===""&&!req.has(name))continue;
    args[name]=(p.type==="integer")?parseInt(v,10):(p.type==="number")?parseFloat(v):v}
  return args;
}

  if(e.kind==="floor"){S.floor.push(e); if(S.showFloor)appendFeed(e); return}
  if(e.kind==="build"||e.kind.startsWith("fixture_")){refreshAll();return}
  if(e.kind.startsWith("equipment_")){refreshAll();return}
  if(e.kind==="photo_deleted"&&e.prefix){
    $$("img,video").forEach(el=>{if((el.getAttribute("src")||"").startsWith(e.prefix)){
      const chip=document.createElement("span"); chip.className="chip"; chip.textContent="photo deleted";
      el.replaceWith(chip)}});
    $$("a").forEach(a=>{if((a.getAttribute("href")||"").startsWith(e.prefix))a.remove()});
  }
  S.events.push(e); if(S.events.length>1500)S.events.splice(0,500);
  if(e.kind==="say"||e.kind==="ask")popFace(e.robot);
  appendFeed(e);
  if(["renamed","moved_on","came_back","removed","online","offline","state","born","painted","soul_edited","reset","saw","located","watched","drew","painting"].includes(e.kind))debouncedRefresh();
}
function appendFeed(e){
  if(NONFEED.includes(e.kind))return;
  const feed=$("#feed"); if(!feed)return;
  const ctx=S.sel==="house"?"house":"talk";
  if(S.sel!=="house"&&!relevant(e,S.sel))return;
  const html=feedHTML(e,ctx); if(!html)return;
  const tmp=document.createElement("div"); tmp.innerHTML=html;
  const empty=feed.querySelector(".hint"); if(empty&&feed.children.length<=1)feed.innerHTML="";
  while(tmp.firstChild)feed.appendChild(tmp.firstChild);
  wireZoom(feed); feed.scrollTop=feed.scrollHeight;
}
function connectUi(){
  const proto=location.protocol==="https:"?"wss://":"ws://";
  const ws=new WebSocket(proto+location.host+"/ws/ui");
  ws.onopen=async()=>{try{const info=await api("/api/info");
    if(S.loadedUi&&info.ui&&info.ui!==S.loadedUi){
      const active=document.activeElement;
      if(active&&(active.tagName==="INPUT"||active.tagName==="TEXTAREA")&&active.value){
        setTimeout(()=>location.reload(),5000)} else location.reload()}
    S.loadedUi=info.ui||S.loadedUi}catch(e){}};
  ws.onmessage=ev=>{try{onEvent(JSON.parse(ev.data))}catch(e){}};
  ws.onclose=()=>setTimeout(connectUi,1500);
  ws.onerror=()=>{try{ws.close()}catch(e){}};
}
(async function start(){
  try{S.info=await api("/api/info"); S.loadedUi=S.info.ui||0}catch(e){}
  try{S.events=(await api("/api/events")).filter(e=>!NONFEED.includes(e.kind))}catch(e){S.events=[]}
  S.floor=S.events.filter(e=>e.kind==="floor"); S.events=S.events.filter(e=>e.kind!=="floor");
  await refreshAll(); connectUi();
})();
</script>
